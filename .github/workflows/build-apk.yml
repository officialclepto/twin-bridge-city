name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already have the Android SDK; just make sure
      # the pieces this app needs are there and the licenses are accepted.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TwinBridgeCity.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: TwinBridgeCity-APK
          path: TwinBridgeCity.apk

      # Puts the newest APK on the repo's Releases page so it can be downloaded
      # straight onto a phone from:
      # https://github.com/<owner>/<repo>/releases/latest/download/TwinBridgeCity.apk
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o "versionName '[^']*'" android/app/build.gradle | cut -d"'" -f2)
          TAG="v$VER-build${{ github.run_number }}"
          gh release create "$TAG" TwinBridgeCity.apk --target "${{ github.sha }}" --latest \
            --title "Twin Bridge City: Street Legends $VER (build ${{ github.run_number }})" \
            --notes "Download TwinBridgeCity.apk on your Android phone and open it to install. If asked, allow installing apps from this source."
