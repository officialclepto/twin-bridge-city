name: Build iPhone app

# Builds an unsigned IPA (Sideloadly / AltStore sign it with your Apple ID at install time)
# and adds it to the release made by the Android build for the same commit.
# GitHub's free Mac machines are sometimes busy; if this gets cancelled, re-run it from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/web.yml', '.github/workflows/build.yml', '*.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the iPhone app
        working-directory: ios
        run: |
          xcodebuild -project TwinBridgeCity.xcodeproj -scheme TwinBridgeCity -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -f "$APP/assets/index.html"   # the game must be inside the app
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry TwinBridgeCity.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: TwinBridgeCity.ipa
      - name: Add the IPA to this commit's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq '[.[] | select(.target_commitish == "${{ github.sha }}")][0].tag_name // empty')
            [ -n "$TAG" ] && break
            echo "waiting for the Android release..."; sleep 30
          done
          [ -n "$TAG" ] || TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" TwinBridgeCity.ipa --clobber
          echo "Added to $TAG"
