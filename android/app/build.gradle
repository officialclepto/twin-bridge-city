plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twinbridgecity.streetlegends'
    compileSdk 35

    defaultConfig {
        applicationId 'com.twinbridgecity.streetlegends'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'webp', 'png'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
