const LIMB = {
  armF: { part: 'armF', piv: 'pivF', j: 'elbF', end: 'handF' }, armB: { part: 'armB', piv: 'pivB', j: 'elbB', end: 'handB' },

  }

    this.hasHit = false; this.whiff = false; this.chopHits = 0; this.flash = 0; this.dizzy = 0; this.laugh = 0; this.dizzyChar = '$'; this.dizzyCol = '#7dff7a'; this.land = 0; this.trail = { hand: [], foot: [] }; this.jumps = 0; this.airAtk = false; this.air = false; this.flipT = 0; this.chain = 0; this.finisher = false; this.comboN = 0; this.atk = 'punch'; this.hidden = false; this.finPose = null; this.finReadyShown = false; this.holdP = 0; this.hit2 = false;

// ---------- CPU ----------
function cpuInput(f, opp) {
  const inp = { left: false, right: false, up: false, down: false, punch: false, kick: false, special: false };
  const ai = f.ai; ai.t--;
  const dist = Math.abs(opp.x - f.x), toward = opp.x > f.x ? 'right' : 'left', away = toward === 'right' ? 'left' : 'right';
  const oppAttacking = ['punch', 'kick', 'special'].includes(opp.state);
  if (f.blind > 0) { if (ai.t <= 0) { ai.act = ['left', 'right', 'punch', 'kick', null][Math.floor(Math.random() * 5)]; ai.t = 20; } if (ai.act) inp[ai.act] = true; return inp; }

  if (f.state === 'charge') return inp;

  if (!f.onGround()) {
    if (f.state === 'jump' && f.jumps === 1 && f.vy > -3 && ai.dj && edge('up')) { inp.up = true; ai.dj = false; return inp; }
    if (f.state === 'jump' && !f.airAtk && f.vy > -6 && dist < 230 && Math.random() < lerp(0.15, 0.5, L0)) { if (edge('kick')) inp.kick = true; return inp; }
    if (ai.air) inp[toward] = true;
    return inp;
  }
  // keep a combo going once a hit lands
  if ((f.state === 'punch' || f.state === 'kick') && f.hasHit && f.chain < styleOf(f).chain - 1 && ['punch', 'kick'].includes(f.atk) && f.t > f.A[f.atk].start + 2 && Math.random() < lerp(0.2, 0.75, L0)) {
    const seq = styleOf(f).combo.split(' '), k = seq[f.chain + 1] === 'K' ? 'kick' : 'punch'; if (edge(k)) inp[k] = true; return inp;
  }

  if (!opp.onGround() && opp.vy > -8 && dist < 210 && f.canAct() && ai.aa !== opp.jumps + '' + Math.floor(tick / 60) && Math.random() < lerp(0.05, 0.35, L0)) { ai.aa = opp.jumps + '' + Math.floor(tick / 60); inp.down = true; if (edge('punch')) inp.punch = true; return inp; }
  if (ai.t <= 0) {
    const L = L0; ai.air = false;
    ai.t = Math.floor(lerp(rand(14, 30), rand(4, 11), clamp(L, 0, 1))); ai.act = null;
    const sp = f.activeSpecial(), ready = (f.meter >= 100 || f.stolen) && f.locked <= 0;
    const spRange = { smash: 230, axe: 200, smoke: 900, steal: 260, teleport: 900, combo: 210, cash: 900, umbrella: 900, lid: 240, moneybag: 230, alien: 900, petals: 900, grenade: 650, dbluppercut: 230, laugh: 900, fireball: 900 }[sp];
    if (ready && dist < spRange && Math.random() < lerp(0.25, 0.85, L)) ai.act = 'special';
    else if (dist < 240 && !oppAttacking && edge('punch') && Math.random() < lerp(0.04, 0.13, L)) { ai.hold = 34 + f.A.punch.start + f.A.punch.active + f.A.punch.rec; ai.t = 2; inp.punch = true; return inp; }
    else if (oppAttacking && dist < 230 && Math.random() < lerp(0.2, 0.8, L)) { ai.act = 'down'; ai.t = 18; }
    else if (dist < 150) ai.act = Math.random() < lerp(0.3, 0.6, L) ? 'punch' : Math.random() < 0.7 ? 'kick' : away;
    else if (dist < 220) ai.act = Math.random() < 0.3 ? 'lunge' : Math.random() < 0.4 ? 'kick' : toward;
    else if (dist < 430 && Math.random() < lerp(0.06, 0.2, L)) { ai.act = 'up'; ai.air = true; ai.dj = Math.random() < 0.55; } // jump in
    else ai.act = Math.random() < 0.05 ? 'up' : toward;
    if (dist < 160 && ai.act !== 'special' && Math.random() < lerp(0.03, 0.12, L)) { ai.act = 'up'; ai.air = true; ai.dj = Math.random() < 0.65; } // hop over them
  }
  if (ai.act === 'up') { if (edge('up')) inp.up = true; inp[toward] = true; ai.act = null; }
  else if (ai.act === 'lunge') { inp[toward] = true; if (edge('kick')) inp.kick = true; ai.act = null; }
  else if (ai.act) inp[ai.act] = true;
  return inp;
}

// ---------- Poses ----------

const PUNCH_WIND = P_({ armF: 12, elbF: -178, lean: -4, head: -2, sx: 1.02 });

const KICK_CHAMBER = P_({ legF: 82, kneeF: -118, lean: -8, oy: 2, head: -3 });
const KICK_EXT = P_({ legF: 88, kneeF: -2, lean: -15, ox: 14, legB: -8, kneeB: -16, armB: -45, elbB: 120, armF: 30, elbF: -150, head: -5, sx: 0.95 });
const BLOCK = P_({ armF: -22, elbF: -150, armB: 22, elbB: 150, oy: 14, legF: 22, kneeF: -34, legB: -16, kneeB: -24, lean: -5, head: -6 });
const HIT = P_({ bf: false, lean: -16, head: -16, ox: -14, armF: 25, elbF: 30, armB: -40, elbB: -20, legF: 24, kneeF: -28, legB: -20, kneeB: -10, sx: 1.04 });

    }

    else if (e.type === 'missile') { ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(1, -0.4) - Math.PI / 2); ctx.fillStyle = '#4d5f2a'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(-12, -50, 24, 90, 10); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffb03a'; ctx.beginPath(); ctx.moveTo(-10, -50); ctx.lineTo(0, -80 - Math.random() * 20); ctx.lineTo(10, -50); ctx.fill(); }
    else if (e.type === 'safe') { ctx.translate(e.x, e.y); ctx.fillStyle = '#c99a1e'; ctx.strokeStyle = '#3a2808'; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-110, -200, 220, 200, 12); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#e8c04a'; ctx.fillRect(-90, -180, 180, 160); ctx.strokeRect(-90, -180, 180, 160); ctx.fillStyle = '#3a2808'; ctx.beginPath(); ctx.arc(0, -100, 30, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#e8c04a'; ctx.beginPath(); ctx.arc(0, -100, 18, 0, Math.PI * 2); ctx.fill(); ctx.font = 'bold 44px Impact, Arial Black'; ctx.fillStyle = '#3a2808'; ctx.textAlign = 'center'; ctx.fillText('$', 0, -150); }
    else if (e.type === 'heart') { const a = e.life / e.max, s = 1 + (1 - a) * 1.5; ctx.globalAlpha = a; ctx.translate(e.x, e.y); ctx.scale(s * 6, s * 6); ctx.fillStyle = 'rgba(255,90,30,0.55)'; ctx.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 40 * Math.PI * 2; ctx.lineTo(16 * Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))); } ctx.fill(); }
    else if (e.type === 'twinkle') { if (e.max - e.life > e.delay) { const k = (e.max - e.life - e.delay), s = Math.sin(Math.min(1, k / 20) * Math.PI) * 30 + 6; ctx.translate(clamp(e.x, 60, W - 60), 40); ctx.rotate(k * 0.1); ctx.fillStyle = '#fff6c0'; ctx.shadowColor = '#4fb8ff'; ctx.shadowBlur = 30; ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.25 : s; ctx.lineTo(Math.cos(i * Math.PI / 4) * r, Math.sin(i * Math.PI / 4) * r); } ctx.fill(); } }
    ctx.restore();
  }
  finFx = finFx.filter(e => e.life > 0);
}
function drawFinOverlay() { // screen-space parts: darkening, the slash, letterbox, prompts
    const sl = finFx.find(e => e.type === 'slash');
  if (sl) { const a = sl.life / sl.max; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 14 * a + 2; ctx.shadowColor = '#ffcf2e'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.moveTo(W * 0.62, -20); ctx.lineTo(W * 0.38, H + 20); ctx.stroke(); ctx.restore(); }
  if (phase === 'finish' && fin) {
    const left = Math.max(0, Math.ceil((FIN_WINDOW - phaseT) / FPS)), s = 1 + Math.sin(tick * 0.3) * 0.05;
    ctx.save(); ctx.translate(W / 2, 250); ctx.scale(s, s); if (!gfx('finish_em', 0, 0, 720)) txt("FINISH 'EM!", 0, 0, 110, tick % 16 < 8 ? '#ff2e2e' : '#ffcf2e', 'center', 12); ctx.restore();
    const human = !fin.w.cpu;
    txt(human ? (isTouch ? 'TAP SPECIAL!' : 'PRESS SPECIAL!') : fin.w.c.name + ' IS MOVING IN...', W / 2, 348, 36, '#fff', 'center', 6);
    txt(String(left), W / 2, 408, 54, '#ffcf2e', 'center', 8);
  }
  if (phase === 'finisher' && fin) {
    const a = Math.min(1, fin.t / 10); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 38 * a); ctx.fillRect(0, H - 38 * a, W, 38 * a);
    txt(styleOf(fin.w).finName, W / 2, H - 19, 30, '#ffcf2e', 'center', 5);
    txt(fin.w.c.name, W / 2, 20, 20, '#fff', 'center', 4);
  }
}

// ---------- Main loop ----------
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts; acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / FPS) { step(); acc -= 1000 / FPS; }
  render();
}
function wantTrack() {
  if (scene === 'title') return 'title';
  if (scene === 'select' || scene === 'stage' || scene === 'ladder') return 'select';
  if (scene === 'vs' || scene === 'fight') return arc && arc.final ? 'boss' : STAGE_TRACKS[Math.max(0, STAGES.indexOf(stage)) % 3];
  if (scene === 'matchover') return mode === 1 && P[1].wins >= 2 ? 'lose' : 'victory';
  if (scene === 'ending') return 'champion';
  return null;
}
function step() {
  tick++;
  if (scene === 'vs' && ++phaseT > 110) { scene = 'fight'; startRound(); }
  if (camKick > 0) camKick--;
  let skip = false;
  if (scene === 'fight' && slowmo > 0) { slowmo--; skip = slowmo % 3 !== 0; }
  if (scene === 'fight' && !skip) updateFight();
  if (scene === 'matchover') { for (const f of P) computePose(f); phaseT++;
    if (arc && !arc.pending && P[1].wins >= 2 && phaseT > 40 + 600) { scene = 'gameover'; phaseT = 0; vo(['game_over']); } }
  if (scene === 'ladder' || scene === 'ending') phaseT++;
  if (scene === 'gameover' && ++phaseT > 240) quitToTitle();
  playMusic(wantTrack());
  if (!skip) updateEffects();
  for (const k in latch) delete latch[k]; for (const k in touchLatch) delete touchLatch[k];
  document.getElementById('pad').style.display = (scene === 'fight' && isTouch) ? 'block' : 'none';
}
function render() {
  buttons.length = 0;
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') drawTitle();
  else if (scene === 'select') drawSelect();
  else if (scene === 'stage') drawStageSelect();
  else if (scene === 'vs') drawVS();
  else if (scene === 'fight') drawFight();
  else if (scene === 'matchover') drawMatchOver();
  else if (scene === 'ladder') drawLadder();
  else if (scene === 'ending') drawEnding();
  else if (scene === 'gameover') drawGameOver();
  if (scene !== 'fight' && scene !== 'vs' && scene !== 'gameover') drawAudioToggles();
}

// canvas taps
function canvasPoint(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointerdown', e => {
  audio(); const p = canvasPoint(e);
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; } }
});

// touch pad
document.querySelectorAll('#pad [data-k]').forEach(el => {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); audio(); touchState[k] = true; touchLatch[k] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); touchState[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
});

resize();
loadAssets().then(() => { buildStage(); requestAnimationFrame(frame); document.getElementById('loading').remove(); });

</script>
</body>
